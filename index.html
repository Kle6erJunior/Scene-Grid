<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene Grid</title>
    <link rel="shortcut icon" href="imagens/favicon/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="estilos/style.css">

</head>
<body>
    <header>
        <h1>Scene Grid</h1>
    </header>

    <h2>Scene Grid</h2>
    <p>Galeria de screenshots de filmes em alta qualidade. </p>

<div class="filmes">

    <figure class="filme">
        <img src="capas/2001.png" alt="2001: A Space Odyssey">
        <figcaption>
            <a href="#">2001: A Space Odyssey</a>
        </figcaption> <!--figure + figcaption, semanticamente representa exatamente um poster acompanhado do nome do filme-->
    </figure>
    
    <figure class="filme">
        <img src="capas/the-apartament.png" alt="The Apartament">
        <figcaption>
            <a href="#">The Apartament</a>
        </figcaption>
    </figure>

        <img src="capas/big-lebowski.png" alt="The Big Lebowski">

            <a href="#">The Big Lebowski</a>
        </figcaption>
    </figure>

    <figure class="filme">
        <img src="capas/blade-runner.png" alt="Blade Runner">
        <figcaption>
            <a href="#">Blade Runner</a>
        </figcaption>
    </figure>

        <img src="capas/boogie-nights.png" alt="Boogie Nights">

        <img src="capas/hana-bi.png" alt="Hana-bi">

            <a href="#">Hana-bi</a>
        </figcaption>
    </figure>

</html>
